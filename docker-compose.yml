services:
  nginx:
    image: nginx:alpine
    container_name: class_magazine_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - class_magazine_network

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: class_magazine_php
    volumes:
      - ./src:/var/www/html
    networks:
      - class_magazine_network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: class_magazine_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: class_magazine
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - class_magazine_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: class_magazine_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
    depends_on:
      - mysql
    networks:
      - class_magazine_network

volumes:
  mysql_data:

networks:
  class_magazine_network:
    driver: bridge
